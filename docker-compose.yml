# ==============================================================
# Proyecto de Aula: Módulo Mapa de Conocimiento (21 tablas · MariaDB)
# Stack obligatorio: Backend Python (FastAPI) + Frontend Python (Flask + Jinja2)
# Versiones acumulativas: v1 (8 tablas sin FK) ⊂ v2 (10 tablas con FK) ⊂ v3 (JWT + Roles)
#
# Uso: docker compose up -d --build
# Reset BD: docker compose down -v && docker compose up -d --build
# ==============================================================
services:

  mariadb:
    image: mariadb:11
    container_name: mapa-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-MapaRoot2026!}"
      MARIADB_DATABASE: "${DB_NAME:-mapa_conocimiento}"
      MARIADB_USER: "${DB_USER:-mapa_user}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-MapaConocimiento2026!}"
    ports:
      - "13333:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mapa-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "8108:80"
    depends_on:
      mariadb:
        condition: service_healthy

  api-mapa:
    build: ./api_mapa
    container_name: mapa-api-fastapi
    restart: unless-stopped
    ports:
      - "8117:8117"
    volumes:
      - ./api_mapa:/app
    environment:
      DB_HOST: "${DB_HOST:-mariadb}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME:-mapa_conocimiento}"
      DB_USER: "${DB_USER:-mapa_user}"
      DB_PASSWORD: "${DB_PASSWORD:-MapaConocimiento2026!}"
      JWT_SECRET: "${JWT_SECRET:-SuperClaveSecretaMapaConocimientoParaJwt2026*}"
      JWT_ISSUER: "${JWT_ISSUER:-ApiMapaConocimiento}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-FrontMapaConocimiento}"
      JWT_EXPIRACION_MINUTOS: "${JWT_EXPIRACION_MINUTOS:-60}"
    depends_on:
      mariadb:
        condition: service_healthy

  front-flask:
    build: ./front_flask
    container_name: mapa-front-flask
    restart: unless-stopped
    ports:
      - "8116:8116"
    volumes:
      - ./front_flask:/app
    environment:
      # El frontend NO recibe credenciales de MariaDB: solo la URL HTTP de la API.
      URL_API: "${URL_API:-http://api-mapa:8117}"
    depends_on:
      - api-mapa

volumes:
  mariadb_data:

# ==============================================================
# Proyecto Aplicación y Servicios Web — Stack 100% Python (v1 ⊂ v2 ⊂ v3)
#
#   Navegador → FRONT FLASK (Flask + Jinja2, :8099) → API FASTAPI (FastAPI, :8035) → SQL Server (bdfacturas)
#
# Uso: docker compose up -d --build
# Secretos: lee variables desde .env (ver .env.example) con valores locales de desarrollo.
# ==============================================================
services:

  # --- SQL Server 2022 ---
  sqlserver:
    restart: unless-stopped
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Paradigmas123!}"
      MSSQL_PID: Developer
    volumes:
      - mssqldata:/var/opt/mssql
    ports:
      - "11463:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # --- Inicializador (crea bdfacturas la primera vez y termina) ---
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Paradigmas123!}"
    volumes:
      - ./db:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    restart: "no"

  # --- API Facturas en Python (FastAPI + PyMSSQL + PyJWT + BCrypt) ---
  api-facturas:
    build: ./api_python
    container_name: facturas-api-python
    volumes:
      - ./api_python:/app
    restart: unless-stopped
    ports:
      - "8035:8032"
      - "8032:8032"
    environment:
      ConnectionStrings__SqlServer: "Server=${DB_HOST:-sqlserver},${DB_PORT:-1433};Database=${DB_NAME:-bdfacturas_sqlserver_local};User Id=${DB_USER:-sa};Password=${MSSQL_SA_PASSWORD:-Paradigmas123!};TrustServerCertificate=True;"
      Jwt__Key: "${JWT_KEY:-SuperClaveSecretaUltraSeguraParaFirmarJwtDeFacturas2026*}"
      Jwt__Issuer: "${JWT_ISSUER:-ApiFacturas}"
      Jwt__Audience: "${JWT_AUDIENCE:-FrontFacturas}"
      Jwt__ExpiracionHoras: "${JWT_EXPIRACION_HORAS:-1}"
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully

  # --- Interfaz Gráfica en Python (Flask + Jinja2 + Bootstrap local) ---
  front-python:
    build: ./front_python
    container_name: facturas-front-python
    ports:
      - "8099:8096"
      - "8096:8096"
    volumes:
      - ./front_python:/app
    environment:
      # El front NO recibe credenciales de SQL Server: solo conoce la URL HTTP de la API.
      UrlApi: "${URL_API:-http://api-facturas:8032}"
    depends_on:
      - api-facturas

volumes:
  mssqldata:
